<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin:0; font-family:'Helvetica Neue',Arial,sans-serif; color:#0E1424;
           background:#F4F7FB; -webkit-font-smoothing:antialiased; }
    a { color:#004090; } a:hover { color:#00336d; }
    .caja { background:#fff; border:1px solid #B7791F; border-radius:10px;
            box-shadow:0 1px 2px rgba(14,20,36,.04), 0 6px 18px rgba(14,20,36,.06);
            overflow:hidden; }
    .cab { display:flex; align-items:center; gap:10px; padding:12px 18px 11px;
           border-bottom:1px solid #EEF1F6; }
    .cab .k { font-size:9.5px; font-weight:700; letter-spacing:.1em;
              text-transform:uppercase; color:#B7791F; flex:1 1 auto; }
    .cab .n { font-size:11px; color:#8A93A6; font-variant-numeric:tabular-nums; }
    .fila { display:flex; align-items:center; gap:13px; padding:11px 18px;
            border-bottom:1px solid #EEF1F6; }
    .fila:last-child { border-bottom:0; }
    .ico { width:28px; height:28px; border-radius:8px; display:flex;
           align-items:center; justify-content:center; flex:none; }
    .ico.rojo { background:#FBEEE9; color:#B4502E; }
    .ico.amb  { background:#FBF3E2; color:#B7791F; }
    .ico svg { width:15px; height:15px; stroke:currentColor; stroke-width:2; fill:none; }
    .txt { flex:1 1 auto; min-width:0; }
    .txt b { display:block; font-size:13px; font-weight:700; }
    .txt span { font-size:11.5px; color:#5B6478; }
    .ir { font-size:11.5px; font-weight:700; color:#004090; flex:none; }
    .pie { padding:9px 18px 11px; font-size:11.5px; font-weight:700; color:#004090; }
  </style>
</helmet>
<div style="width:1040px; height:290px; box-sizing:border-box; padding:22px 24px; display:flex; align-items:center;">
  <div class="caja" style="width:100%;">
    <div class="cab">
      <span class="k">Te toca a ti</span>
      <span class="n">3 solicitudes</span>
    </div>
    <div class="fila">
      <div class="ico rojo"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9L2 18a2 2 0 001.7 3h16.6a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg></div>
      <div class="txt">
        <b>RIF de la empresa</b>
        <span>Devuelta hace 2 días — «El comprobante del capital está ilegible.»</span>
      </div>
      <div class="ir">Corregir →</div>
    </div>
    <div class="fila">
      <div class="ico amb"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></div>
      <div class="txt">
        <b>Visa de inversionista</b>
        <span>Sin enviar desde hace 3 días · te faltan 2 datos</span>
      </div>
      <div class="ir">Seguir →</div>
    </div>
    <div class="fila">
      <div class="ico amb"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></div>
      <div class="txt">
        <b>Constitución de la compañía</b>
        <span>Sin enviar desde hace 3 semanas</span>
      </div>
      <div class="ir">Seguir →</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
