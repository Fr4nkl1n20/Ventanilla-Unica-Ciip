<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin:0; font-family:'Helvetica Neue',Arial,sans-serif; color:#0E1424;
           background:#F4F7FB; -webkit-font-smoothing:antialiased; }
    a { color:#004090; } a:hover { color:#00336d; }
    .ns { display:flex; align-items:center; gap:16px; background:#fff;
          border:1px solid #B7791F; border-radius:10px; padding:15px 18px;
          box-shadow:0 1px 2px rgba(14,20,36,.04), 0 6px 18px rgba(14,20,36,.06); }
    .ico { width:40px; height:40px; border-radius:10px; background:#FBF3E2;
           color:#B7791F; display:flex; align-items:center; justify-content:center; flex:none; }
    .ico svg { width:21px; height:21px; stroke:currentColor; stroke-width:1.9; fill:none; }
    .body { flex:1 1 auto; min-width:0; }
    .k { font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#B7791F; }
    .t { font-size:14.5px; font-weight:700; margin-top:2px; }
    .d { font-size:12px; color:#5B6478; margin-top:3px; }
    .mas { font-size:11.5px; color:#004090; font-weight:700; margin-top:5px; display:inline-block; }
    .btn { font-size:11.5px; font-weight:700; color:#fff; background:#004090;
           border-radius:8px; padding:9px 15px; flex:none; }
    .lado { display:flex; flex-direction:column; align-items:flex-end; gap:7px; flex:none; }
    .sec { font-size:11px; font-weight:700; color:#5B6478; }
  </style>
</helmet>
<div style="width:1040px; height:150px; box-sizing:border-box; padding:26px 24px; display:flex; align-items:center;">
  <div class="ns" style="width:100%;">
    <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></div>
    <div class="body">
      <div class="k">Sin terminar</div>
      <div class="t">Visa de inversionista</div>
      <div class="d">La empezaste <b style="color:#0E1424;">hace 3 días</b> y todavía no la has enviado.</div>
      <span class="mas">Y hay 2 más esperando por ti →</span>
    </div>
    <div class="lado">
      <div class="btn">Ir al trámite</div>
      <div class="sec">Descartarla</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
